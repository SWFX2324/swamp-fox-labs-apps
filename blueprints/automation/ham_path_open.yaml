blueprint:
  name: Ham Radio Dashboard – band opens on a saved path
  description: >-
    Run actions when a band turns Good on one of your saved paths (save paths on
    the dashboard's Propagation tab). In your actions you can use {{ label }},
    {{ band }}, {{ muf }}, {{ bearing }} and {{ heard }}, for example
    "{{ band }} is open to {{ label }} (beam {{ bearing }}°)".
  domain: automation
  source_url: https://github.com/SWFX2324/swamp-fox-labs-apps/blob/main/blueprints/automation/ham_path_open.yaml
  input:
    path:
      name: Saved path
      description: >-
        The path's ID, as in its sensor name: "japan" for sensor.ham_path_japan.
        Leave blank for any saved path.
      default: ""
      selector:
        text: {}
    bands:
      name: Bands
      description: Which bands to alert on.
      default: ["80m", "40m", "30m", "20m", "17m", "15m", "12m", "10m"]
      selector:
        select:
          multiple: true
          options: ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m"]
    actions:
      name: Actions
      description: What to do when a band opens, for example send a notification.
      selector:
        action: {}

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: ham_dashboard_path_open

variables:
  path: !input path
  bands: !input bands
  label: "{{ trigger.event.data.label }}"
  band: "{{ trigger.event.data.band }}"
  muf: "{{ trigger.event.data.muf_mhz }}"
  bearing: "{{ trigger.event.data.bearing | round(0) }}"
  heard: "{{ trigger.event.data.heard }}"

conditions:
  - condition: template
    value_template: >-
      {{ band in bands and (path | trim == '' or path | trim | lower == trigger.event.data.path) }}

actions: !input actions
