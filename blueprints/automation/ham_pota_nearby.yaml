blueprint:
  name: Ham Radio Dashboard – POTA activation nearby
  description: >-
    Run actions when a new Parks on the Air activation appears near you (within
    the app's pota_alert_radius, and the distance below). In your actions you can
    use {{ activator }}, {{ park }}, {{ reference }}, {{ frequency }}, {{ mode }},
    {{ distance }} and {{ bearing }}, for example
    "{{ activator }} is at {{ park }}, {{ distance }} km {{ bearing }}".
  domain: automation
  source_url: https://github.com/SWFX2324/swamp-fox-labs-apps/blob/main/blueprints/automation/ham_pota_nearby.yaml
  input:
    max_km:
      name: Maximum distance
      description: Only alert for activations closer than this.
      default: 300
      selector:
        number:
          min: 10
          max: 5000
          step: 10
          unit_of_measurement: km
    bands:
      name: Bands
      description: Only alert on these bands.
      default: ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m", "2m"]
      selector:
        select:
          multiple: true
          options: ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m", "2m"]
    actions:
      name: Actions
      description: What to do when a park is activated nearby.
      selector:
        action: {}

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: ham_dashboard_pota_spot

variables:
  max_km: !input max_km
  bands: !input bands
  activator: "{{ trigger.event.data.activator }}"
  park: "{{ trigger.event.data.park }}"
  reference: "{{ trigger.event.data.reference }}"
  frequency: "{{ trigger.event.data.frequency_khz }}"
  mode: "{{ trigger.event.data.mode }}"
  distance: "{{ trigger.event.data.distance_km }}"
  bearing: "{{ trigger.event.data.bearing }}"

conditions:
  - condition: template
    value_template: >-
      {{ (trigger.event.data.distance_km | float(99999)) <= (max_km | float(0))
         and trigger.event.data.band in bands }}

actions: !input actions
