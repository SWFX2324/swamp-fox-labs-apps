# Checks every push and pull request: Home Assistant's app linter on
# config.yaml, that the AppArmor profile parses, a syntax check of every
# script, the unit and end-to-end tests, the blueprints, and the built image
# running under its enforced AppArmor profile.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: App linter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./ham_dashboard
      # Home Assistant refuses to install an app whose profile doesn't parse.
      # This only parses it (-Q: not loaded into the runner's kernel).
      - name: AppArmor profile parses
        run: |
          sudo apt-get install -y -qq apparmor > /dev/null
          sudo apparmor_parser -Q -K -T ham_dashboard/apparmor.txt
          echo "apparmor.txt parses"

  test:
    name: Syntax and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Syntax check
        run: for f in $(find ham_dashboard/app -name '*.js' -not -path '*/lib/*'); do node --check "$f" || exit 1; done
      - name: Unit and end-to-end tests
        run: node --test "ham_dashboard/tests/*.test.js"
      - name: Blueprints
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 .github/scripts/check_blueprints.py

  apparmor:
    name: Image under AppArmor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --quiet -t ham-dashboard:ci --build-arg BUILD_VERSION=ci ham_dashboard
      # Loaded into the runner's kernel and enforced, as Home Assistant does.
      - name: Load the AppArmor profile
        run: |
          sudo apt-get install -y -qq apparmor > /dev/null
          sudo apparmor_parser -r -W ham_dashboard/apparmor.txt
      - name: Run the image and call every endpoint
        run: bash .github/scripts/apparmor_smoke.sh
