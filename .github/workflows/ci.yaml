# Checks every push and pull request: Home Assistant's app linter on
# config.yaml, a syntax check of every script, and the unit tests.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: App linter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./ham_dashboard

  test:
    name: Syntax and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Syntax check
        run: for f in $(find ham_dashboard/app -name '*.js' -not -path '*/lib/*'); do node --check "$f" || exit 1; done
      - name: Unit tests
        run: node --test "ham_dashboard/tests/*.test.js"
