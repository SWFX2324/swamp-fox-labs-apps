name: Ham Radio Dashboard
version: "0.7.0"
slug: ham_dashboard
description: Band conditions, space weather, MUF maps and DX spots for amateur radio operators
url: https://github.com/SWFX2324/swamp-fox-labs-apps/tree/main/ham_dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
homeassistant_api: true
services:
  - mqtt:want
panel_icon: mdi:radio-tower
panel_title: Ham Radio
options:
  callsign: ""
  grid: ""
  distance_units: mi
  dx_cluster_enabled: true
  dx_cluster_host: dxc.ve7cc.net
  dx_cluster_port: 23
  qrz_username: ""
  qrz_password: ""
  aprs_enabled: true
  aprs_radius: 100
  ha_sensors: true
  ha_mqtt: true
  spot_watch: []
  pota_alert_radius: 100
  nws_alerts: true
  lightning_entity: ""
  lightning_alert_distance: 15
schema:
  callsign: "match(^[A-Za-z0-9/]{0,15}$)"
  grid: "match(^([A-Ra-r]{2}[0-9]{2}([A-Xa-x]{2})?)?$)"
  distance_units: list(mi|km)
  dx_cluster_enabled: bool
  dx_cluster_host: str
  dx_cluster_port: port
  qrz_username: "str?"
  qrz_password: "password?"
  aprs_enabled: bool
  aprs_radius: int(10,300)
  ha_sensors: bool
  ha_mqtt: bool
  spot_watch:
    - str
  pota_alert_radius: int(0,5000)
  nws_alerts: bool
  lightning_entity: "str?"
  lightning_alert_distance: int(1,100)
