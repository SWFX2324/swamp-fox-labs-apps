configuration:
  callsign:
    name: Callsign
    description: Your amateur radio callsign. Used to log in to the DX cluster and to look up who is hearing you on PSKReporter.
  grid:
    name: Grid square
    description: Your Maidenhead locator (4 or 6 characters, e.g. DM14xd). Used for local band estimates, the gray line map and distances.
  distance_units:
    name: Distance units
    description: Show distances in miles or kilometers.
  dx_cluster_enabled:
    name: Connect to DX cluster
    description: Keep a telnet connection to a DX cluster for live spots. Requires a callsign.
  dx_cluster_host:
    name: DX cluster host
    description: Telnet host of the DX cluster (default dxc.ve7cc.net).
  dx_cluster_port:
    name: DX cluster port
    description: Telnet port of the DX cluster (default 23).
  qrz_username:
    name: QRZ username
    description: Optional. Your QRZ.com username, for worldwide callsign lookups. A QRZ XML Logbook Data subscription unlocks full details; without one, QRZ returns basic info only.
  qrz_password:
    name: QRZ password
    description: Optional. Your QRZ.com password. It stays on your Home Assistant and is only sent to QRZ.
  aprs_enabled:
    name: Live APRS
    description: Keep a receive-only connection to APRS-IS for the APRS tab. Requires a callsign and grid square.
  aprs_radius:
    name: APRS range
    description: How far around your grid square to receive APRS stations, in your distance units (10-300).
  ha_sensors:
    name: Home Assistant sensors
    description: Publish solar, band, satellite and POTA data as sensor.ham_* and binary_sensor.ham_* entities, and fire ham_dashboard_* events for alerts.
  ha_mqtt:
    name: Use MQTT for entities
    description: When the Mosquitto broker app is installed, register the sensors through MQTT discovery under a "Ham Radio" device, so they can be renamed and keep their values when Home Assistant restarts. Without a broker, sensors are created through the REST API.
  spot_watch:
    name: DX spot watch list
    description: Callsigns or prefixes to watch on the DX cluster (e.g. VP8PJ or 3Y0). A match fires a ham_dashboard_dx_spot event you can use in automations.
  pota_alert_radius:
    name: POTA alert radius
    description: Fire a ham_dashboard_pota_spot event when a new POTA activation is spotted within this distance, in your distance units. 0 turns POTA alerts off.
  nws_alerts:
    name: NWS weather alerts
    description: Check National Weather Service alerts and the hourly forecast for your grid square (US only) for storm safety.
  lightning_entity:
    name: Lightning sensor entity
    description: Optional. A Home Assistant sensor whose state is the distance to the last lightning strike, e.g. from an Ecowitt WH57, Ambient Weather or ESPHome AS3935 sensor.
  lightning_alert_distance:
    name: Lightning alert distance
    description: Turn on binary_sensor.ham_lightning_danger when the lightning sensor reports a strike within this distance (in your units) in the last 30 minutes.
